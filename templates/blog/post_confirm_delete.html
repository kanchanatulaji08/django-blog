{% extends "base.html" %}

{% block title %}Delete post | Django Blog{% endblock %}

{% block content %}
  <h1>Delete post</h1>
  <form method="post" class="form card">
    {% csrf_token %}
    <p>Are you sure you want to delete &ldquo;{{ object.title }}&rdquo;? This cannot be undone.</p>
    <button type="submit" class="btn btn-danger">Yes, delete</button>
    <a href="{{ object.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
